<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-Global CV Group — Admin</title>
<style>
:root{--navy:#071f49;--blue:#0b3d91;--green:#16a085;--bg:#f5f7fb;--text:#101828;--muted:#667085;--line:#e4e7ec;--danger:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}.hidden{display:none!important}.wrap{max-width:1180px;margin:auto;padding:24px 18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.brand h1{margin:0;font-size:25px}.brand p{margin:5px 0 0;color:var(--muted)}
.box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 6px 24px #1018280a}
.login{max-width:460px;margin:70px auto}.login h2{margin-top:0}.field{margin-bottom:12px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}
input,textarea,select{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px;outline:0;background:#fff}input:focus,textarea:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #0b3d9118}textarea{min-height:110px;resize:vertical}
.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:#fff}.green{background:var(--green);color:#fff}.danger{background:#fee4e2;color:var(--danger)}.gray{background:#eef2f6;color:#344054}.small{padding:8px 11px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px}.stat span{display:block;color:var(--muted);font-size:13px;font-weight:700}.stat b{display:block;font-size:28px;margin-top:5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.item{border:1px solid var(--line);border-radius:13px;padding:14px;margin:9px 0;background:#fff}.item-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.meta{color:var(--muted);font-size:13px;line-height:1.7}.thumb{width:74px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.badge{display:inline-block;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:800}.on{background:#dcfae6;color:#067647}.off{background:#f2f4f7;color:#475467}
.notice{padding:11px 13px;border-radius:10px;margin:10px 0;font-size:14px}.error{background:#fef3f2;color:#b42318;border:1px solid #fecdca}.success{background:#ecfdf3;color:#027a48;border:1px solid #abefc6}.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed #cbd5e1;border-radius:12px}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.section-title h2{margin:0}.search{max-width:330px}
@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.full{grid-column:auto}}
@media(max-width:480px){.stats{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.login{margin:30px auto}}
</style>
</head>
<body>
<div id="loginView" class="wrap">
  <div class="box login">
    <h2>E-Global CV Group</h2>
    <p style="color:#667085">Admin panelə təhlükəsiz giriş</p>
    <div class="field"><label>E-poçt</label><input id="email" type="email" autocomplete="username"></div>
    <div class="field"><label>Şifrə</label><input id="pass" type="password" autocomplete="current-password"></div>
    <button id="loginBtn" class="btn primary" style="width:100%">Daxil ol</button>
    <div id="loginMsg"></div>
  </div>
</div>

<div id="app" class="wrap hidden">
  <div class="top">
    <div class="brand"><h1>E-Global CV Group</h1><p>İdarəetmə paneli</p></div>
    <button id="logout" class="btn danger">Çıxış</button>
  </div>

  <div id="msg"></div>

  <div class="stats">
    <div class="stat"><span>Ümumi vakansiya</span><b id="vcount">0</b></div>
    <div class="stat"><span>Aktiv vakansiya</span><b id="vactive">0</b></div>
    <div class="stat"><span>CV nümunəsi</span><b id="ccount">0</b></div>
    <div class="stat"><span>Ümumi baxış</span><b id="views">0</b></div>
  </div>

  <div class="box">
    <div class="section-title"><h2>Yeni vakansiya</h2></div>
    <form id="vf" class="grid" style="margin-top:14px">
      <div class="field"><label>Vəzifə</label><input id="title" required></div>
      <div class="field"><label>Şirkət</label><input id="company" required></div>
      <div class="field"><label>Şəhər</label><input id="city"></div>
      <div class="field"><label>Kateqoriya</label><input id="category"></div>
      <div class="field"><label>Maaş</label><input id="salary"></div>
      <div class="field"><label>İş qrafiki</label><input id="work"></div>
      <div class="field"><label>WhatsApp</label><input id="phone" placeholder="Boş saxlasanız 0516410799"></div>
      <div class="field"><label>Status</label><select id="active"><option value="true">Aktiv</option><option value="false">Deaktiv</option></select></div>
      <div class="field full"><label>Təsvir</label><textarea id="desc" required></textarea></div>
      <div class="actions full"><button class="btn primary">Vakansiyanı yerləşdir</button></div>
    </form>
  </div>

  <div class="box">
    <div class="section-title"><h2>Yeni CV nümunəsi</h2></div>
    <form id="cf" class="grid" style="margin-top:14px">
      <div class="field"><label>CV adı</label><input id="ctitle" required></div>
      <div class="field"><label>Peşə</label><input id="profession" required></div>
      <div class="field"><label>Qiymət</label><input id="price"></div>
      <div class="field"><label>Status</label><select id="cactive"><option value="true">Aktiv</option><option value="false">Deaktiv</option></select></div>
      <div class="field full"><label>Şəkil</label><input id="file" type="file" accept="image/jpeg,image/png,image/webp" required></div>
      <div class="field full"><label>CV haqqında</label><textarea id="cdesc" required></textarea></div>
      <div class="actions full"><button id="uploadBtn" class="btn green">Şəkli yüklə və yerləşdir</button></div>
    </form>
    <div id="upload"></div>
  </div>

  <div class="box">
    <div class="section-title">
      <h2>Vakansiyalar</h2>
      <input id="vsearch" class="search" placeholder="Vakansiya axtar...">
    </div>
    <div id="vl" style="margin-top:12px"></div>
  </div>

  <div class="box">
    <div class="section-title">
      <h2>CV nümunələri</h2>
      <input id="csearch" class="search" placeholder="CV axtar...">
    </div>
    <div id="cl" style="margin-top:12px"></div>
  </div>
</div>

<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";

const db=createClient(
  "https://guxpboapzddhkjhgfb.supabase.co",
  "sb_publishable_AkDIpLiU4kn3ab0RHFK1Zg_jH7KUC7R"
);
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const adminCheck=async()=>{
  const {data:{user},error}=await db.auth.getUser();
  if(error||!user)return null;
  const {data,isError}=await db.from("admins").select("user_id").eq("user_id",user.id).maybeSingle();
  if(isError)return null;
  return data?user:null;
};
const message=(text,type="success",target="msg")=>{
  $(target).innerHTML=text?`<div class="notice ${type}">${esc(text)}</div>`:"";
};
async function boot(){
  const user=await adminCheck();
  $("loginView").classList.toggle("hidden",!!user);
  $("app").classList.toggle("hidden",!user);
  if(user)await load();
}
$("loginBtn").onclick=async()=>{
  $("loginBtn").disabled=true;
  message("","", "loginMsg");
  const {error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("pass").value});
  if(error){message(error.message,"error","loginMsg");$("loginBtn").disabled=false;return}
  const user=await adminCheck();
  if(!user){
    await db.auth.signOut();
    message("Bu hesab admin kimi qeydiyyatdan keçməyib.","error","loginMsg");
    $("loginBtn").disabled=false;
    return;
  }
  $("loginView").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("loginBtn").disabled=false;
  await load();
};
$("logout").onclick=async()=>{await db.auth.signOut();location.reload()};

$("vf").onsubmit=async e=>{
  e.preventDefault();
  const user=await adminCheck(); if(!user)return location.reload();
  const {error}=await db.from("vacancies").insert({
    title:$("title").value.trim(),company:$("company").value.trim(),city:$("city").value.trim(),
    category:$("category").value.trim(),salary:$("salary").value.trim(),
    work_schedule:$("work").value.trim(),
    whatsapp:$("phone").value.replace(/\D/g,"")||"994516410799",
    description:$("desc").value.trim(),active:$("active").value==="true"
  });
  if(error){message(error.message,"error");return}
  e.target.reset();$("active").value="true";message("Vakansiya uğurla yerləşdirildi.");await load();
};

$("cf").onsubmit=async e=>{
  e.preventDefault();
  const user=await adminCheck(); if(!user)return location.reload();
  const f=$("file").files[0];
  if(!f)return;
  if(f.size>8*1024*1024){message("Maksimum fayl ölçüsü 8 MB-dır.","error","upload");return}
  if(!["image/jpeg","image/png","image/webp"].includes(f.type)){message("Yalnız JPG, PNG və WebP qəbul olunur.","error","upload");return}
  $("uploadBtn").disabled=true;message("Yüklənir...","success","upload");
  const ext=f.name.split(".").pop().toLowerCase();
  const path=crypto.randomUUID()+"."+ext;
  const up=await db.storage.from("cv-images").upload(path,f,{contentType:f.type,upsert:false});
  if(up.error){message(up.error.message,"error","upload");$("uploadBtn").disabled=false;return}
  const {data:p}=db.storage.from("cv-images").getPublicUrl(path);
  const {error}=await db.from("cv_samples").insert({
    title:$("ctitle").value.trim(),profession:$("profession").value.trim(),
    price:$("price").value.trim(),description:$("cdesc").value.trim(),
    image_path:path,image_url:p.publicUrl,active:$("cactive").value==="true"
  });
  if(error){
    await db.storage.from("cv-images").remove([path]);
    message(error.message,"error","upload");
  }else{
    e.target.reset();$("cactive").value="true";message("CV nümunəsi uğurla yerləşdirildi.","success","upload");await load();
  }
  $("uploadBtn").disabled=false;
};

async function load(){
  const [v,c]=await Promise.all([
    db.from("vacancies").select("*").order("created_at",{ascending:false}),
    db.from("cv_samples").select("*").order("created_at",{ascending:false})
  ]);
  if(v.error){message("Vakansiyalar yüklənmədi: "+v.error.message,"error");return}
  if(c.error){message("CV nümunələri yüklənmədi: "+c.error.message,"error");return}
  const V=v.data||[],C=c.data||[];
  $("vcount").textContent=V.length;
  $("vactive").textContent=V.filter(x=>x.active).length;
  $("ccount").textContent=C.length;
  $("views").textContent=V.reduce((a,x)=>a+Number(x.views||0),0);
  renderV(V);renderC(C);
}

function renderV(all){
  const q=$("vsearch").value.trim().toLowerCase();
  const V=all.filter(x=>[x.title,x.company,x.city,x.category,x.description].some(v=>String(v||"").toLowerCase().includes(q)));
  $("vl").innerHTML=V.length?V.map(x=>`
    <div class="item">
      <div class="item-head">
        <div><b>${esc(x.title)}</b><div class="meta">${esc(x.company)} · ${esc(x.city||"")} · 👁️ ${x.views||0} baxış</div></div>
        <span class="badge ${x.active?"on":"off"}">${x.active?"AKTİV":"DEAKTİV"}</span>
      </div>
      <div class="meta">${esc(x.category||"")} ${x.salary?"· "+esc(x.salary):""} ${x.work_schedule?"· "+esc(x.work_schedule):""}</div>
      <div class="actions">
        <button class="btn small ${x.active?"gray":"green"} onclick="toggleV('${x.id}',${!x.active})">${x.active?"Deaktiv et":"Aktiv et"}</button>
        <button class="btn small danger" onclick="delV('${x.id}')">Sil</button>
      </div>
    </div>`).join(""):'<div class="empty">Vakansiya tapılmadı.</div>';
}
function renderC(all){
  const q=$("csearch").value.trim().toLowerCase();
  const C=all.filter(x=>[x.title,x.profession,x.description].some(v=>String(v||"").toLowerCase().includes(q)));
  $("cl").innerHTML=C.length?C.map(x=>`
    <div class="item">
      <div class="item-head">
        <div style="display:flex;gap:12px;align-items:center">
          ${x.image_url?`<img class="thumb" src="${esc(x.image_url)}">`:""}
          <div><b>${esc(x.title)}</b><div class="meta">${esc(x.profession||"")} ${x.price?"· "+esc(x.price):""}</div></div>
        </div>
        <span class="badge ${x.active?"on":"off"}">${x.active?"AKTİV":"DEAKTİV"}</span>
      </div>
      <div class="actions">
        <button class="btn small ${x.active?"gray":"green"}" onclick="toggleC('${x.id}',${!x.active})">${x.active?"Deaktiv et":"Aktiv et"}</button>
        <button class="btn small danger" onclick="delC('${x.id}','${esc(x.image_path||"")}')">Sil</button>
      </div>
    </div>`).join(""):'<div class="empty">CV nümunəsi tapılmadı.</div>';
}
$("vsearch").oninput=load;$("csearch").oninput=load;

window.toggleV=async(id,active)=>{
  const {error}=await db.from("vacancies").update({active}).eq("id",id);
  if(error)message(error.message,"error");else await load();
};
window.toggleC=async(id,active)=>{
  const {error}=await db.from("cv_samples").update({active}).eq("id",id);
  if(error)message(error.message,"error");else await load();
};
window.delV=async id=>{
  if(!confirm("Bu vakansiya silinsin?"))return;
  const {error}=await db.from("vacancies").delete().eq("id",id);
  if(error)message(error.message,"error");else await load();
};
window.delC=async(id,path)=>{
  if(!confirm("Bu CV nümunəsi silinsin?"))return;
  const {error}=await db.from("cv_samples").delete().eq("id",id);
  if(error){message(error.message,"error");return}
  if(path)await db.storage.from("cv-images").remove([path]);
  await load();
};

db.auth.onAuthStateChange((_event)=>{
  setTimeout(boot,0);
});
boot();
</script>
</body>
</html>
