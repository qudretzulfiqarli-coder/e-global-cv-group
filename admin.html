<!doctype html>
<html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-Global CV Group — İdarəetmə</title>
<style>
body{margin:0;font-family:Arial;background:#f5f7fb;color:#101828}.wrap{max-width:1100px;margin:auto;padding:25px 18px}.box{background:#fff;border:1px solid #e4e7ec;border-radius:15px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.full{grid-column:1/-1}input,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d0d5dd;border-radius:10px;font:inherit}textarea{min-height:110px}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:#0b3d91;color:white}.green{background:#16a085;color:white}.danger{background:#fee4e2;color:#b42318}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:white;border:1px solid #e4e7ec;border-radius:13px;padding:15px}.stat b{display:block;font-size:25px}.item{padding:13px;border:1px solid #e4e7ec;border-radius:10px;margin:7px 0}.thumb{width:70px;height:90px;object-fit:cover;border-radius:7px}.hidden{display:none}@media(max-width:650px){.grid,.stats{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><div class="wrap">
<div class="row"><div><h1>E-Global CV Group</h1><p>Gizli idarəetmə paneli</p></div><button id="logout" class="btn danger">Çıxış</button></div>
<div id="login" class="box"><h2>Admin giriş</h2><input id="email" type="email" placeholder="Admin e-poçtu"><br><br><input id="pass" type="password" placeholder="Şifrə"><br><br><button id="loginBtn" class="btn primary">Daxil ol</button><p id="msg"></p></div>
<div id="panel" class="hidden">
<div class="stats"><div class="stat">Vakansiya<b id="vcount">0</b></div><div class="stat">CV<b id="ccount">0</b></div><div class="stat">Ümumi baxış<b id="views">0</b></div><div class="stat">WhatsApp<b>0516410799</b></div></div>
<div class="box"><h2>Yeni vakansiya</h2><form id="vf" class="grid"><input id="title" required placeholder="Vəzifə"><input id="company" required placeholder="Şirkət"><input id="city" placeholder="Şəhər"><input id="category" placeholder="Kateqoriya"><input id="salary" placeholder="Maaş"><input id="work" placeholder="İş qrafiki"><input id="phone" placeholder="WhatsApp (boş=0516410799)"><textarea id="desc" class="full" required placeholder="Vakansiyanın təsviri"></textarea><button class="btn primary">Yerləşdir</button></form></div>
<div class="box"><h2>Yeni CV nümunəsi</h2><form id="cf" class="grid"><input id="ctitle" required placeholder="CV adı"><input id="profession" required placeholder="Peşə"><input id="price" placeholder="Qiymət"><input id="file" type="file" accept="image/*" required><textarea id="cdesc" class="full" required placeholder="CV haqqında"></textarea><button class="btn green">Şəkli yüklə və yerləşdir</button></form><p id="upload"></p></div>
<div class="box"><h2>Vakansiyalar və baxışlar</h2><div id="vl"></div></div><div class="box"><h2>CV nümunələri</h2><div id="cl"></div></div>
</div></div>
<script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2";const db=createClient("https://guxpboapzddhkjhgfb.supabase.co","sb_publishable_AkDIpLiU4kn3ab0RHFK1Zg_jH7KUC7R"),$=id=>document.getElementById(id);
$("loginBtn").onclick=async()=>{let{error}=await db.auth.signInWithPassword({email:$("email").value,password:$("pass").value});$("msg").textContent=error?error.message:"";if(!error)show()};
$("logout").onclick=async()=>{await db.auth.signOut();location.reload()};
$("vf").onsubmit=async e=>{e.preventDefault();let{error}=await db.from("vacancies").insert({title:$("title").value,company:$("company").value,city:$("city").value,category:$("category").value,salary:$("salary").value,work_schedule:$("work").value,whatsapp:$("phone").value.replace(/\D/g,"")||"994516410799",description:$("desc").value});alert(error?error.message:"Vakansiya yerləşdirildi");if(!error){e.target.reset();load()}};
$("cf").onsubmit=async e=>{e.preventDefault();let f=$("file").files[0];if(!f)return;if(f.size>8*1024*1024){$("upload").textContent="Maksimum 8 MB";return}$("upload").textContent="Yüklənir...";let path=crypto.randomUUID()+"."+f.name.split(".").pop();let up=await db.storage.from("cv-images").upload(path,f,{contentType:f.type});if(up.error){$("upload").textContent=up.error.message;return}let{data:p}=db.storage.from("cv-images").getPublicUrl(path);let{error}=await db.from("cv_samples").insert({title:$("ctitle").value,profession:$("profession").value,price:$("price").value,description:$("cdesc").value,image_path:path,image_url:p.publicUrl});$("upload").textContent=error?error.message:"CV yerləşdirildi";if(!error){e.target.reset();load()}};
async function load(){let[v,c]=await Promise.all([db.from("vacancies").select("*").order("created_at",{ascending:false}),db.from("cv_samples").select("*").order("created_at",{ascending:false})]);let V=v.data||[],C=c.data||[];$("vcount").textContent=V.length;$("ccount").textContent=C.length;$("views").textContent=V.reduce((a,x)=>a+(x.views||0),0);$("vl").innerHTML=V.map(x=>`<div class="item"><b>${x.title}</b> — ${x.company} | 👁️ ${x.views||0} baxış <button class="btn danger" onclick="delV('${x.id}')">Sil</button></div>`).join("")||"Vakansiya yoxdur";$("cl").innerHTML=C.map(x=>`<div class="item row">${x.image_url?`<img class="thumb" src="${x.image_url}">`:""}<div><b>${x.title}</b> — ${x.profession}<br><button class="btn danger" onclick="delC('${x.id}','${x.image_path||""}')">Sil</button></div></div>`).join("")||"CV yoxdur"}
window.delV=async id=>{if(confirm("Silinsin?")){await db.from("vacancies").delete().eq("id",id);load()}};window.delC=async(id,path)=>{if(confirm("Silinsin?")){await db.from("cv_samples").delete().eq("id",id);if(path)await db.storage.from("cv-images").remove([path]);load()}};
async function show(){let{data:{user}}=await db.auth.getUser();$("login").classList.toggle("hidden",!!user);$("panel").classList.toggle("hidden",!user);if(user)load()}show();
</script></body></html>
