<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-Global CV Group — Admin</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6fa;color:#172033}header{background:#071f49;color:white;padding:22px 28px;display:flex;justify-content:space-between}main{max-width:1200px;margin:auto;padding:24px}.tabs{display:flex;gap:10px;margin-bottom:18px}.tab,.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer}.tab{background:white}.tab.active,.primary{background:#0b3d91;color:white}.green{background:#079455;color:white}.danger{background:#fee4e2;color:#b42318}.gray{background:#eef2f6;color:#344054}.card{background:white;border:1px solid #e3e7ee;border-radius:16px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}input,textarea,select{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:9px;font:inherit}textarea{min-height:120px;resize:vertical}.list{display:grid;gap:10px}.item{border:1px solid #e3e7ee;border-radius:12px;padding:14px;display:flex;justify-content:space-between;gap:15px;align-items:center}.muted{color:#667085;font-size:13px}.actions{display:flex;gap:7px;flex-wrap:wrap}.badge{padding:4px 8px;border-radius:99px;font-size:11px;font-weight:800}.on{background:#dcfae6;color:#067647}.off{background:#f2f4f7;color:#475467}.hidden{display:none}.msg{padding:11px;border-radius:9px;margin-bottom:14px;background:#ecfdf3;color:#027a48}.err{background:#fef3f2;color:#b42318}.thumb{width:70px;height:90px;object-fit:cover;border-radius:7px}.left{display:flex;gap:12px;align-items:center}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.item{flex-direction:column;align-items:flex-start}}
</style></head><body><header><div><b style="font-size:24px">E-Global CV Group</b><div style="opacity:.7;font-size:13px">Birbaşa Admin Panel</div></div><span>İdarəetmə</span></header><main><div id="msg"></div><div class="tabs"><button id="tv" class="tab active">Vakansiyalar</button><button id="tc" class="tab">CV nümunələri</button></div>
<section id="vs"><div class="card"><h2>Yeni vakansiya</h2><form id="vf" class="grid"><div><label>Vəzifə</label><input id="title" required></div><div><label>Şirkət</label><input id="company" required></div><div><label>Şəhər</label><input id="city"></div><div><label>Kateqoriya</label><input id="category"></div><div><label>Maaş</label><input id="salary"></div><div><label>İş qrafiki</label><input id="schedule"></div><div><label>WhatsApp</label><input id="phone" value="994516410799"></div><div><label>Status</label><select id="active"><option value="true">Aktiv</option><option value="false">Deaktiv</option></select></div><div class="full"><label>Təsvir</label><textarea id="desc" required></textarea></div><div class="full"><button class="btn primary">Vakansiyanı əlavə et</button></div></form></div><div class="card"><h2>Vakansiyalar</h2><div id="vl" class="list"></div></div></section>
<section id="cs" class="hidden"><div class="card"><h2>Yeni CV nümunəsi</h2><form id="cf" class="grid"><div><label>CV adı</label><input id="ctitle" required></div><div><label>Peşə</label><input id="profession" required></div><div><label>Qiymət</label><input id="price"></div><div><label>Status</label><select id="cactive"><option value="true">Aktiv</option><option value="false">Deaktiv</option></select></div><div class="full"><label>Şəkil</label><input id="image" type="file" accept="image/*" required></div><div class="full"><label>Təsvir</label><textarea id="cdesc" required></textarea></div><div class="full"><button class="btn green">CV-ni əlavə et</button></div></form></div><div class="card"><h2>CV nümunələri</h2><div id="cl" class="list"></div></div></section></main>
<script type="module">import{createClient}from"https://esm.sh/@supabase/supabase-js@2";const db=createClient("https://guxpboapzddhkjhgfb.supabase.co","sb_publishable_AkDIpLiU4kn3ab0RHFK1Zg_jH7KUC7R"),$=x=>document.getElementById(x),e=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));function msg(t,b=1){$("msg").innerHTML=t?`<div class="msg ${b?"":"err"}">${e(t)}</div>`:"";setTimeout(()=>$("msg").innerHTML="",3000)}async function load(){let[v,c]=await Promise.all([db.from("vacancies").select("*").order("created_at",{ascending:false}),db.from("cv_samples").select("*").order("created_at",{ascending:false})]);if(v.error)return msg(v.error.message,0);if(c.error)return msg(c.error.message,0);$("vl").innerHTML=(v.data||[]).map(x=>`<div class="item"><div><b>${e(x.title)}</b><div class="muted">${e(x.company)} · ${e(x.city||"")} · ${x.views||0} baxış</div><div class="muted">${e(x.salary||"")} · ${e(x.work_schedule||"")}</div><span class="badge ${x.active?"on":"off"}">${x.active?"AKTİV":"DEAKTİV"}</span></div><div class="actions"><button class="btn gray" onclick="tv('${x.id}',${!x.active})">${x.active?"Deaktiv et":"Aktiv et"}</button><button class="btn danger" onclick="dv('${x.id}')">Sil</button></div></div>`).join("")||"<div class=muted>Vakansiya yoxdur.</div>";$("cl").innerHTML=(c.data||[]).map(x=>`<div class="item"><div class=left>${x.image_url?`<img class=thumb src="${e(x.image_url)}">`:""}<div><b>${e(x.title)}</b><div class=muted>${e(x.profession||"")} · ${e(x.price||"")}</div><span class="badge ${x.active?"on":"off"}">${x.active?"AKTİV":"DEAKTİV"}</span></div></div><div class=actions><button class="btn gray" onclick="tc('${x.id}',${!x.active})">${x.active?"Deaktiv et":"Aktiv et"}</button><button class="btn danger" onclick="dc('${x.id}','${e(x.image_path||"")}')">Sil</button></div></div>`).join("")||"<div class=muted>CV yoxdur.</div>"}$("vf").onsubmit=async z=>{z.preventDefault();let{error}=await db.from("vacancies").insert({title:$("title").value.trim(),company:$("company").value.trim(),city:$("city").value.trim(),category:$("category").value.trim(),salary:$("salary").value.trim(),work_schedule:$("schedule").value.trim(),whatsapp:$("phone").value.replace(/\D/g,""),description:$("desc").value.trim(),views:0,active:$("active").value==="true"});if(error)msg(error.message,0);else{z.target.reset();$("phone").value="994516410799";msg("Vakansiya əlavə edildi");load()}};$("cf").onsubmit=async z=>{z.preventDefault();let f=$("image").files[0],path=crypto.randomUUID()+"."+f.name.split(".").pop().toLowerCase(),u=await db.storage.from("cv-images").upload(path,f,{contentType:f.type});if(u.error)return msg(u.error.message,0);let p=db.storage.from("cv-images").getPublicUrl(path).data.publicUrl,{error}=await db.from("cv_samples").insert({title:$("ctitle").value.trim(),profession:$("profession").value.trim(),price:$("price").value.trim(),description:$("cdesc").value.trim(),image_path:path,image_url:p,active:$("cactive").value==="true"});if(error){await db.storage.from("cv-images").remove([path]);msg(error.message,0)}else{z.target.reset();msg("CV əlavə edildi");load()}};window.tv=async(i,a)=>{let{error}=await db.from("vacancies").update({active:a}).eq("id",i);if(error)msg(error.message,0);load()};window.dv=async i=>{if(confirm("Silinsin?")){let{error}=await db.from("vacancies").delete().eq("id",i);if(error)msg(error.message,0);load()}};window.tc=async(i,a)=>{let{error}=await db.from("cv_samples").update({active:a}).eq("id",i);if(error)msg(error.message,0);load()};window.dc=async(i,p)=>{if(confirm("Silinsin?")){let{error}=await db.from("cv_samples").delete().eq("id",i);if(error)msg(error.message,0);if(!error&&p)await db.storage.from("cv-images").remove([p]);load()}};$("tv").onclick=()=>{$("vs").classList.remove("hidden");$("cs").classList.add("hidden");$("tv").classList.add("active");$("tc").classList.remove("active")};$("tc").onclick=()=>{$("vs").classList.add("hidden");$("cs").classList.remove("hidden");$("tc").classList.add("active");$("tv").classList.remove("active")};load();</script></body></html>
